name: 功能请求
description: 提议 fqc 的新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。请说明使用场景，帮助维护者判断价值。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: "你遇到了什么场景 / 痛点？"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: "你希望 fqc 如何解决？"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: "目前你是怎么绕过的？（可选）"

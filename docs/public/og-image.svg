<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo Box -->
  <rect x="80" y="200" width="80" height="80" rx="12" fill="#0e7c6b"/>
  <text x="120" y="255" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">FQ</text>

  <!-- Title -->
  <text x="180" y="250" font-family="system-ui, sans-serif" font-size="64" font-weight="700" fill="#34d399">fqc</text>

  <!-- Subtitle -->
  <text x="80" y="320" font-family="system-ui, sans-serif" font-size="28" fill="#94a3b8">Block-Indexed FASTQ Compression</text>

  <!-- Stats Bar -->
  <rect x="80" y="380" width="1040" height="80" rx="8" fill="#21262d"/>

  <!-- Stat 1 -->
  <text x="180" y="425" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#34d399" text-anchor="middle">2.4×</text>
  <text x="180" y="450" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Compression Ratio</text>

  <!-- Stat 2 -->
  <text x="440" y="425" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#34d399" text-anchor="middle">O(log N)</text>
  <text x="440" y="450" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Random Access</text>

  <!-- Stat 3 -->
  <text x="700" y="425" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#34d399" text-anchor="middle">3</text>
  <text x="700" y="450" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Execution Modes</text>

  <!-- Stat 4 -->
  <text x="960" y="425" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#34d399" text-anchor="middle">0</text>
  <text x="960" y="450" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">unsafe Code</text>

  <!-- Footer -->
  <text x="1120" y="580" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="end">Rust • GPL-3.0 • Bioinformatics</text>
</svg>
